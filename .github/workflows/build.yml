name: java CI with Maven
on:
    push:
      branches: ["main", "dev", "prod-support"]
    pull_request:
      branches: ["main","dev", "prod-support"]


jobs:

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: 21

      - name: Maven Package
        run: mvn -B clean package
      - name: Maven verify
        run: mvn -B clean verify
